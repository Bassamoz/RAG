# Postgres/Auth/Storage are provided by ONE Supabase local stack on the host.
# Do not add a second application Postgres here.
name: store-advisor
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      APP_ENV: dev
      DATABASE_URL: ${DATABASE_URL_CONTAINER:?Run scripts/dev.py first}
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    command: [".venv/bin/celery", "-A", "store_advisor.celery_app:app", "worker", "--loglevel=WARNING", "--concurrency=2"]
    environment:
      APP_ENV: dev
      DATABASE_URL: ${DATABASE_URL_CONTAINER:?Run scripts/dev.py first}
      REDIS_URL: redis://redis:6379/0
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: { condition: service_healthy }
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    environment:
      API_ORIGIN: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  redis-data:
