# Separate isolated CI infrastructure; never run alongside the development DB.
name: store-advisor-test
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: store_advisor_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set a generated test-only password}
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store_advisor_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs: ["/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:56379:6379"]
