[project]
name = "store-advisor-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.38,<1", "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2.0.44,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.17,<2",
  "celery[redis]>=5.5,<6", "redis>=5.2,<7"
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "httpx>=0.28,<1",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "pip-audit>=2.9,<3",
    "celery-types>=0.26.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/store_advisor"]

[tool.pytest.ini_options]
testpaths = ["../../tests/unit"]
addopts = "-ra"
markers = ["integration: requires actual isolated PostgreSQL, Redis and Celery"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
files = ["src/store_advisor"]

