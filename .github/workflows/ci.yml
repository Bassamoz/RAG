name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_ORIGIN: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api ruff check --config apps/api/pyproject.toml apps/api tests scripts/export_openapi.py scripts/provision_runtime.py scripts/dev.py scripts/ci-integration.py scripts/record_check.py scripts/smoke_local_http.py scripts/diagnose_runtime.py scripts/verify_development.py scripts/verify_clean_checkout.py
      - run: uv run --project apps/api ruff format --check --config apps/api/pyproject.toml apps/api tests scripts/export_openapi.py scripts/provision_runtime.py scripts/dev.py scripts/ci-integration.py scripts/record_check.py scripts/smoke_local_http.py scripts/diagnose_runtime.py scripts/verify_development.py scripts/verify_clean_checkout.py
      - run: uv run --project apps/api mypy --config-file apps/api/pyproject.toml apps/api/src/store_advisor
      - run: uv run --project apps/api pytest -c apps/api/pyproject.toml tests/unit
      - run: uv run --project apps/api pytest -c apps/api/pyproject.toml tests/smoke
      - run: uv run --project apps/api python scripts/export_openapi.py
      - run: git diff --exit-code -- packages/api-client/openapi.json
      - run: pnpm contract:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: uv run --project apps/api python scripts/ci-integration.py
      - run: pnpm audit --audit-level=high
      - run: uv run --project apps/api pip-audit --skip-editable
      - name: Build API container
        run: docker build -f infra/api.Dockerfile -t store-advisor-api:ci .
      - name: Build web container
        run: docker build -f infra/web.Dockerfile -t store-advisor-web:ci .
